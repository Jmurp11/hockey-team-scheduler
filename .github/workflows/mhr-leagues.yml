name: MHR Leagues Scrape

# Scrapes the myhockeyrankings.com league directory into Supabase via
# p_batch_leagues. Runs an hour ahead of the rankings scrape because team rows
# reference leagues.

on:
  schedule:
    # Wednesdays at 11:00 UTC (06:00 ET)
    - cron: "0 11 * * 3"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "Manual trigger"

permissions:
  contents: read
  issues: write

concurrency:
  group: mhr-leagues
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape and load leagues
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail

          # p_batch_leagues is an upsert, so retrying is safe.
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt"
            if npx tsx mhr-etl/src/leagues/insertLeagues.ts; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              DELAY=$((attempt * 30))
              echo "Retrying in ${DELAY}s..."
              sleep "$DELAY"
            fi
          done

          echo "All 3 attempts failed"
          exit 1

  report-failure:
    name: Report failures
    needs: scrape
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled MHR leagues scrape failed after 3 attempts.`,
              ``,
              `- Run: ${runUrl}`,
              `- Triggered by: \`${context.eventName}\``,
              `- Commit: ${context.sha.slice(0, 7)}`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'mhr-etl-failure',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              return;
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'mhr-etl-failure',
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'mhr-etl-failure',
                color: 'B60205',
                description: 'Automated MHR ETL failure reports',
              });
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'MHR leagues scrape failed',
              body,
              labels: ['mhr-etl-failure'],
            });
